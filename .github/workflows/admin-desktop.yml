name: Build Networkk Admin Desktop

on:
  push:
    branches: [main]
    paths:
      - "src/pages/OwnerVault.tsx"
      - "src/pages/AdminDashboard.tsx"
      - "src/components/guards/**"
      - "src/**"
      - "electron/**"
      - "package.json"
      - ".github/workflows/admin-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-admin:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build desktop admin
        run: npm run desktop:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Networkk-Admin-Windows
          path: release/admin-desktop/*.exe
          if-no-files-found: error
          retention-days: 14
