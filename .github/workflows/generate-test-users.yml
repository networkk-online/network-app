name: Generate Networkk Test Users

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of test accounts (1-10000)"
        required: true
        default: "10000"
      prefix:
        description: "Username prefix"
        required: true
        default: "networkk"
      concurrency:
        description: "Parallel requests (1-50)"
        required: true
        default: "20"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun add @supabase/supabase-js
      - name: Generate accounts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COUNT: ${{ inputs.count }}
          PREFIX: ${{ inputs.prefix }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: bun scripts/generate-test-users.mjs
      - name: Upload credentials securely
        uses: actions/upload-artifact@v4
        with:
          name: networkk-test-users
          path: test-users.json
          retention-days: 1
